apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playit-agent
  template:
    metadata:
      labels:
        app: playit-agent
    spec:
      containers:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:0.15
          env:
            # Secret criado fora do Git (kubectl create secret). Mantem a
            # credencial do agente fora do repositorio.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: playit-secret
                  key: secret-key
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
